# Agent Notifier runtime configuration.
# This file is copied to ~/.config/agent-notifier/config.toml on first install.

[progress]
# Add cc-connect's OnIt reaction as soon as a Feishu task is received.
onit = true

# Show thinking/tool/test phase transitions in a cc-connect progress card.
progress_card = true

# Show user-visible assistant text while the final response is being generated.
stream_preview = false
stream_update_interval_ms = 2000

# Move an OnIt reaction to each new intermediate message from a Feishu turn.
moving_onit = true

# Report an active turn that ends because the App Server stops unexpectedly.
notify_interruption = true

# Keep long-running OpenCode turns alive across ACP/socket idle timeouts.
# This is an internal thought update and is not model output.
heartbeat_interval_ms = 15000

# Session-scoped fallback targets.  Change these route names to the routes
# that point to the Codex P2P chat and the OpenCode interactive group.
# [agent_routes]
# codex = "codex_p2p"
# opencode = "opencode_group"

# Optional explicit outbound notification targets. Interactive chats remain
# under [chat_routes]; this route is for terminal and pipeline notifications.
#
# [notification_routes.default]
# project = "le-wm-codex"
# receive_id_type = "chat_id"
# receive_id = "oc_your_notification_group_chat_id"
# message_format = "markdown" # or "text"
# session_key = "feishu:oc_your_notification_group_chat_id:terminal:ses_your_session_id"
#
# [notification_routes.codex_p2p]
# project = "le-wm-codex"
# receive_id_type = "open_id"
# receive_id = "ou_your_codex_p2p_open_id"
# message_format = "markdown"
#
# [notification_routes.opencode_group]
# project = "le-wm-opencode"
# receive_id_type = "chat_id"
# receive_id = "oc_your_opencode_group_chat_id"
# message_format = "markdown"
# session_key = "feishu:oc_your_opencode_group_chat_id:terminal:ses_your_session_id"
#
# [notification_routes.acp]
# project = "le-wm-codex"
# receive_id_type = "chat_id"
# receive_id = "oc_your_acp_group_chat_id"
